# Publie la web app sur GitHub Pages à chaque modification.
# Réglage unique : Settings › Pages › Source : « GitHub Actions ».
name: Web app

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'apps-script/**', 'scripts/**', '.github/workflows/ciqual.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Export web
        run: npx expo export --platform web
        env:
          CI: 1
      - name: Routes de l'app (GitHub Pages renvoie 404.html pour les adresses inconnues)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # le service worker est versionné à chaque publication pour vider l'ancien cache
          sed -i "s/foodvictor-v1/foodvictor-${GITHUB_SHA::8}/" dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
